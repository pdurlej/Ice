name: Build macOS and Create DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialize per-ref (each release tag is unique, so this only guards against a
# duplicate run of the same tag re-push). NEVER cancel in progress — a build
# killed mid-notarization would leave a half-published release (issue #9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write  # the release is published via the `gh` CLI on tag push
    env:
      # Identity strings constructed below from APPLE_TEAM_ID + the cert's CN.
      # Notarization auth comes from the four APPLE_* / APP_SPECIFIC_PASSWORD secrets.
      CODE_SIGN_IDENTITY: "Developer ID Application"
    steps:
      - name: Checkout code
        # SHA-pinned (tag kept as a trailing comment) so a tag move upstream
        # can't inject code into a workflow that holds the signing secrets (#9).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Xcode
        # Skip maxim-lobanov/setup-xcode action - codeload.github.com
        # had a partial outage during the first fire.7.1 ship attempt
        # that intermittently blocked action archive downloads. Runner
        # images come with multiple Xcode versions preinstalled at
        # /Applications/Xcode_*.app — pick the highest Xcode 26.x because
        # that's the one with the macOS 26 SDK we actually need.
        # XPCListener(service:requirement:) is a macOS 26-only API, so
        # MacOSX26.* SDK is mandatory. /Applications/Xcode.app symlinks
        # to Xcode_16.x on current runner images (ships MacOSX15.5.sdk),
        # which is why the first xcode-select-only attempt died with
        # "extra arguments at positions #2, #3" inside the @available
        # macOS 26 guard.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "ERROR: no Xcode 26.x installed on runner" >&2
            ls -d /Applications/Xcode*.app >&2 2>&1
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Import Code-Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a fresh, ephemeral keychain so we don't pollute the runner's
          # default and so we can isolate codesign lookups to exactly our cert.
          KEYCHAIN_PATH="$RUNNER_TEMP/fire-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
              -P "$P12_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"

          # Allow codesign to use the imported identity without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make our keychain the first in the search list (does not remove others).
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Sanity-check that the signing identity is actually findable.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Shred the on-disk .p12 — the cert now lives only in the ephemeral keychain.
          rm -f "$CERTIFICATE_PATH"

      - name: Create build directory
        run: mkdir -p build

      - name: Build archive (unsigned — we sign manually after)
        run: |
          xcodebuild -scheme Ice \
            -project Ice.xcodeproj \
            -configuration Release \
            -archivePath "$PWD/build/Ice.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Upload dSYMs to Sentry (symbolicate crashes & App Hangs)
        # The archive's dSYMs carry the Mach-O UUIDs, which survive the manual
        # codesign below, so they symbolicate the shipped binary. Without this,
        # our own frames render as "<anonymous> [in-app]" in Sentry and every
        # hang has to be reverse-engineered from library frames. Guarded on the
        # token so the build still works for forks/PRs that lack the secret.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pdurlej
          SENTRY_PROJECT: fire
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set — skipping dSYM upload."
            echo "Add it (Settings → Secrets → Actions) to enable symbolication."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload "build/Ice.xcarchive/dSYMs"

      - name: Codesign the .app with Developer ID (hardened runtime + secure timestamp)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp -R "build/Ice.xcarchive/Products/Applications/Ice.app" build/Ice.app

          # Resolve the full signing identity string from the imported cert by Team ID.
          # The CN of a Developer ID Application cert is exactly:
          #   "Developer ID Application: <Common Name> (<TEAMID>)"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/fire-build.keychain-db" \
                      | grep "Developer ID Application" \
                      | grep -o '"[^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: no 'Developer ID Application' identity in the ephemeral keychain." >&2
            security find-identity -v -p codesigning "$RUNNER_TEMP/fire-build.keychain-db" >&2
            exit 1
          fi
          echo "Using identity: $IDENTITY"

          # --options runtime  → enable the hardened runtime (required by notarization)
          # --timestamp        → embed a secure Apple timestamp (also required)
          # --deep             → recurse into nested bundles (Sparkle.framework + its XPCs)
          # --force            → re-sign anything already signed (e.g. dependency frameworks)
          # --preserve-metadata=entitlements,identifier,flags
          #                    → keep any embedded entitlements (.entitlements file if present),
          #                      the bundle's signed identifier, and the existing hardened-runtime
          #                      flags. Without this, re-signing strips entitlements from the
          #                      xcarchive output and we silently lose them. Ice currently has
          #                      no .entitlements file in source — but upstream may add one any
          #                      day and we don't want a subtle regression.
          codesign --force --deep --options runtime --timestamp \
                   --preserve-metadata=entitlements,identifier,flags \
                   --sign "$IDENTITY" \
                   "build/Ice.app"

          # Verify thoroughly.
          codesign --verify --strict --verbose=2 "build/Ice.app"
          codesign -dv --verbose=4 "build/Ice.app" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier|CDHash|Authority"
          spctl -avv --type execute "build/Ice.app" || true   # often says "rejected" pre-notarization

          du -sh build/Ice.app

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="build-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # Apple's notarization service requires submission in a single-file
      # container; we zip the .app, submit, wait for the verdict, then
      # staple the ticket INTO the .app bundle BEFORE we pack the DMG.
      # If we staple only the DMG (the obvious shortcut), the .app
      # extracted from the DMG ends up unstapled — Gatekeeper accepts it
      # via online lookup, but first launch needs an internet round-trip
      # and offline machines fail. Staple the app first, then repack.

      - name: Submit .app for notarization and wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Ice.app build/Ice-app.zip
          # --wait blocks until Apple's notary service finishes (~3-10 min typical).
          # If it fails, the next step pulls the rejection log.
          xcrun notarytool submit build/Ice-app.zip \
              --apple-id "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          rm -f build/Ice-app.zip

      - name: Staple notarization ticket to the .app
        run: |
          xcrun stapler staple build/Ice.app
          xcrun stapler validate build/Ice.app
          # spctl should now report Notarized Developer ID, source=Notarized Developer ID
          spctl -avv --type execute build/Ice.app

      - name: Create DMG (containing the stapled .app)
        run: |
          if [ ! -d "build/Ice.app" ]; then
            echo "Error: Ice.app not found in build directory" >&2
            ls -la build/
            exit 1
          fi

          mkdir -p dmg-contents
          cp -R "build/Ice.app" dmg-contents/
          ln -s /Applications dmg-contents/Applications

          hdiutil create -volname "Ice ${{ steps.version.outputs.VERSION }}" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            "build/Ice-${{ steps.version.outputs.VERSION }}.dmg"

          rm -rf dmg-contents

      - name: Codesign the DMG
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/fire-build.keychain-db" \
                      | grep "Developer ID Application" \
                      | grep -o '"[^"]*"' | head -1 | tr -d '"')
          codesign --force --timestamp --sign "$IDENTITY" \
                   "build/Ice-${{ steps.version.outputs.VERSION }}.dmg"
          codesign --verify --verbose=2 "build/Ice-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Submit DMG for notarization and wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
              "build/Ice-${{ steps.version.outputs.VERSION }}.dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

      - name: Staple notarization ticket to the DMG
        run: |
          xcrun stapler staple "build/Ice-${{ steps.version.outputs.VERSION }}.dmg"
          xcrun stapler validate "build/Ice-${{ steps.version.outputs.VERSION }}.dmg"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ice-DMG-${{ steps.version.outputs.VERSION }}
          path: build/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use gh CLI (preinstalled on runners, no action download needed)
          # instead of softprops/action-gh-release. Same end result but
          # resilient to codeload.github.com being degraded - we hit that
          # during fire.7.1 ship when GitHub had a partial outage and
          # action downloads kept failing. Every tagged build remains a
          # prerelease until its signed install passes desktop E2E; Latest and
          # the Sparkle appcast are promoted separately.
          VERSION="${{ steps.version.outputs.VERSION }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" --repo "${{ github.repository }}" --clobber build/*.dmg
            gh release edit "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "Ice $VERSION" \
              --prerelease
          else
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "Ice $VERSION" \
              --generate-notes \
              --prerelease \
              build/*.dmg
          fi

      - name: Tear down the ephemeral keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fire-build.keychain-db" || true
